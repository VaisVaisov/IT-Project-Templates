version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - apt-get install -y doxygen
      - doxygen docs/cpp/Doxyfile

sphinx:
  configuration: docs/python/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
