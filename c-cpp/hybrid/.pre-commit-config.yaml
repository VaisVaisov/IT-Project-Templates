# Pre-commit hooks for Hybrid C/C++ + Python project
# Install: pacman -S python-pre-commit
# Setup: pre-commit install && pre-commit install --hook-type commit-msg

repos:
  # C/C++ formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # C/C++ static analysis
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-tidy
        args: [--config-file=.clang-tidy]
        exclude: ^cython/
      - id: cppcheck
        args: [--enable=warning,style,performance,portability, --suppress=missingIncludeSystem]
        exclude: ^cython/

  # Python linting and formatting (replaces black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Python deep linting
  - repo: https://github.com/pycqa/pylint
    rev: v4.0.5
    hooks:
      - id: pylint
        args: [--max-line-length=100, --disable=C0114,C0115,C0116]

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        exclude: ^docs/

  # Memory safety
  - repo: local
    hooks:
      - id: valgrind
        name: valgrind memcheck
        language: script
        entry: tools/valgrind-check.sh
        pass_filenames: false
        types_or: [c++, c]

  # Conventional commits
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
