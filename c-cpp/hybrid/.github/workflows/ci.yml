name: CI Pipeline

on: [push, pull_request]

jobs:
  build:
    # Note: Ubuntu host is only used to run Docker, all commands execute inside Arch container
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        pacman -S --noconfirm clang cmake ninja gdb doxygen python python-pip

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip --break-system-packages
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt --break-system-packages
        fi
        pip install sphinx sphinx-rtd-theme --break-system-packages

    - name: Build project
      run: |
        mkdir build && cd build
        cmake -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ ..
        ninja

    - name: Run C++ tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Run Python tests
      run: |
        if [ -d "python/tests" ]; then
          cd python/tests
          python -m pytest -v
        fi

    - name: Generate C++ documentation
      run: |
        doxygen docs/cpp/Doxyfile

    - name: Generate Python documentation
      run: |
        cd docs/python
        sphinx-apidoc -o . ../../python --force
        make html

    - name: Publish documentation to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        pacman -S --noconfirm openssh
        mkdir -p docs/_site
        cp -r docs/cpp/generated/html docs/_site/cpp
        cp -r docs/python/_build/html docs/_site/python
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/_site
        git commit -m "📖 Auto-update documentation" || exit 0
        git subtree push --prefix docs/_site origin gh-pages