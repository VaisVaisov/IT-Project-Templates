name: CI Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        pacman -S --noconfirm clang cmake ninja cppcheck python python-pre-commit

    - name: Run pre-commit checks
      run: pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        pacman -S --noconfirm clang cmake ninja cppcheck doxygen \
          python python-pip python-pytest python-sphinx

    - name: Install Python dependencies
      run: |
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt --break-system-packages
        fi

    - name: Build Debug
      run: cmake --preset linux-debug && cmake --build --preset linux-debug

    - name: Build Release
      run: cmake --preset linux-release && cmake --build --preset linux-release

    - name: Run C++ tests
      run: cd cmake-build-linux-debug && ctest --output-on-failure

    - name: Run Python tests
      run: |
        if [ -d "python/tests" ]; then
          python -m pytest python/tests -v
        fi

    - name: Generate C++ documentation
      run: doxygen docs/cpp/Doxyfile

    - name: Generate Python documentation
      run: |
        cd docs/python
        sphinx-apidoc -o . ../../python --force
        make html

    - name: Publish documentation to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        pacman -S --noconfirm openssh
        mkdir -p docs/_site
        cp -r docs/cpp/generated/html docs/_site/cpp
        cp -r docs/python/_build/html docs/_site/python
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/_site
        git commit -m "Auto-update documentation" || exit 0
        git subtree push --prefix docs/_site origin gh-pages
