; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:@BOARD_ENV@]
platform = @PLATFORM@
board = @BOARD@
framework = arduino
; Note: FreeRTOS is available directly within the Arduino framework
; Alternative frameworks (legacy, not recommended):
; framework = esp8266-rtos-sdk  ; Espressif RTOS SDK (deprecated)
; Upload options:
; upload_protocol = esptool    ; USB UART (default)
; upload_protocol = espota     ; OTA (over the air)
