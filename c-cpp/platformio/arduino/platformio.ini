; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:@BOARD_ENV@]
platform = @PLATFORM@
board = @BOARD@
framework = arduino
; or remove framework entirely for bare metal (avr-gcc)
; Upload options:
; upload_protocol = arduino    ; default — UART bootloader (CH340/FTDI)
; upload_protocol = usbasp     ; USBasp ISP programmer
; upload_protocol = usbtiny    ; USBtinyISP programmer
