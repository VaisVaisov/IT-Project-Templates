; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
; Alternative frameworks (remove 'framework = arduino' above):
; framework = espidf           ; ESP-IDF native SDK — pure C/C++
; or remove framework entirely for bare metal
; Upload options:
; upload_protocol = esptool    ; default — USB UART
; upload_protocol = espota     ; OTA (over the air)
; upload_protocol = esp-prog   ; ESP-Prog JTAG
; upload_protocol = cmsis-dap  ; CMSIS-DAP
; upload_protocol = jlink      ; J-Link
