; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:@BOARD_ENV@]
platform = @PLATFORM@
board = @BOARD@
framework = arduino
; Alternative frameworks (remove 'framework = arduino' above):
; framework = pico-sdk         ; Raspberry Pi Pico SDK — direct RP2040 access
; Upload options:
; upload_protocol = picotool   ; USB (hold BOOTSEL button)
; upload_protocol = cmsis-dap  ; SWD debugger (e.g. another Pico as debugger)
