name: Arduino Nano Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm git python python-pip git-cliff

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install PlatformIO Core
      run: |
        pip install --upgrade pip --break-system-packages
        pip install platformio --break-system-packages

    - name: Build firmware
      run: pio run

    - name: Collect firmware artifacts
      run: |
        mkdir -p firmware
        find .pio/build/nanoatmega328new/ -maxdepth 1 \
          \( -name "firmware.elf" -o -name "firmware.hex" -o -name "firmware.bin" \) \
          -exec cp {} firmware/ \;
        ls -lh firmware/

    - name: Generate CHANGELOG
      run: git cliff --current --output CHANGELOG.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: firmware/*
        body_path: CHANGELOG.md
