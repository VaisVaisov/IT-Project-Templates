; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:sparkfun_promicro16]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
; or remove framework entirely for bare metal (avr-gcc)
; Upload options:
; upload_protocol = arduino    ; default — Caterina USB bootloader
; upload_protocol = avr109     ; Caterina bootloader (explicit)
; upload_protocol = usbasp     ; USBasp ISP programmer
; upload_protocol = usbtiny    ; USBtinyISP programmer
