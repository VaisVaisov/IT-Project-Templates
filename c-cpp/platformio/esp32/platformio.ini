; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:@BOARD_ENV@]
platform = @PLATFORM@
board = @BOARD@
framework = arduino
; Alternative frameworks (remove 'framework = arduino' above):
; framework = espidf           ; ESP-IDF — full control, native Espressif SDK
; or remove framework entirely for bare metal
; Upload options:
; upload_protocol = esptool    ; USB UART (default)
; upload_protocol = espota     ; OTA (over the air)
; upload_protocol = esp-prog   ; JTAG debugger
