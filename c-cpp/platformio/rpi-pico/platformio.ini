; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
; Alternative frameworks:
; remove framework entirely for pico-sdk (native Raspberry Pi C/C++ SDK)
; Upload options:
; upload_protocol = picotool        ; default — UF2 / picotool
; upload_protocol = cmsis-dap       ; PicoProbe / CMSIS-DAP
; upload_protocol = jlink           ; J-Link
; upload_protocol = raspberrypi-swd ; SWD via Raspberry Pi GPIO
; debug_tool = cmsis-dap
