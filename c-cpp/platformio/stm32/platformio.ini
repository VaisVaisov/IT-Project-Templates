; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:@BOARD_ENV@]
platform = @PLATFORM@
board = @BOARD@
framework = arduino
; Alternative frameworks (remove 'framework = arduino' above):
; framework = stm32cube        ; STM32Cube HAL — ST's official C HAL library
; framework = cmsis            ; ARM CMSIS — low-level C/assembly
; framework = libopencm3       ; libopencm3 — open source ARM peripheral libs
; or remove framework entirely for bare metal (arm-none-eabi-gcc)
; Upload options:
; upload_protocol = stlink     ; ST-Link programmer (default)
; upload_protocol = dfu        ; USB DFU bootloader
; upload_protocol = jlink      ; J-Link
; upload_protocol = blackmagic ; Black Magic Probe
; debug_tool = stlink
