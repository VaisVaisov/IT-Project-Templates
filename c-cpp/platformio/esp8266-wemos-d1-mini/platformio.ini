; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
; Alternative frameworks (remove 'framework = arduino' above):
; framework = esp8266-rtos-sdk ; FreeRTOS-based SDK
; or remove framework entirely for bare metal
; Upload options:
; upload_protocol = esptool    ; default — USB UART
; upload_protocol = espota     ; OTA (over the air)
