; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
; Alternative frameworks (remove 'framework = arduino' above):
; framework = cmsis            ; ARM CMSIS — low-level C/C++
; framework = libopencm3       ; libopencm3 — open source ARM peripheral libs
; or remove framework entirely for bare metal
; Upload options:
; upload_protocol = stlink     ; ST-Link programmer (default)
; upload_protocol = serial     ; UART bootloader (BOOT0 = HIGH)
; upload_protocol = dfu        ; USB DFU bootloader
; upload_protocol = jlink      ; J-Link
; upload_protocol = blackmagic ; Black Magic Probe
; debug_tool = stlink
