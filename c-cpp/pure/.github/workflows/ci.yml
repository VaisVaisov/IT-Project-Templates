name: CI Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm git

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        pacman -Sy --noconfirm clang cmake ninja cppcheck python python-pre-commit nodejs npm

    - name: Run pre-commit checks
      run: pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm git

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        pacman -Sy --noconfirm clang cmake ninja cppcheck doxygen lcov python python-pip
        pip install genbadge[coverage] lcov_cobertura --break-system-packages

    - name: Build Debug
      run: cmake --preset linux-debug && cmake --build --preset linux-debug

    - name: Build Release
      run: cmake --preset linux-release && cmake --build --preset linux-release

    - name: Run tests
      run: cd cmake-build-linux-debug && ctest --output-on-failure

    - name: Run benchmarks
      run: |
        if [ -d benchmarks ] && compgen -G "benchmarks/*.cpp" > /dev/null; then
          cmake --preset linux-release && cmake --build --preset linux-release
          find cmake-build-linux-release -maxdepth 1 -name "bench_*" -executable \
            -exec {} --benchmark_time_unit=ms \;
        fi

    - name: C++ coverage
      run: |
        cmake --preset linux-coverage && cmake --build --preset linux-coverage
        cd cmake-build-linux-coverage && ctest --output-on-failure
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/libraries/*' '*/test/*' --output-file coverage.info
        lcov --list coverage.info
        genhtml coverage.info --output-directory coverage-html

    - name: Coverage summary
      run: |
        echo "## C++ Coverage Report" >> $GITHUB_STEP_SUMMARY
        lcov --summary cmake-build-linux-coverage/coverage.info 2>&1 \
          | grep -E "lines|functions" >> $GITHUB_STEP_SUMMARY || true

    - name: Upload C++ coverage report
      uses: actions/upload-artifact@v7
      with:
        name: cpp-coverage
        path: cmake-build-linux-coverage/coverage-html

    - name: Generate coverage badge
      if: github.ref == 'refs/heads/main'
      run: |
        mkdir -p docs/_site/badges
        python -m lcov_cobertura cmake-build-linux-coverage/coverage.info -o coverage-cpp.xml
        genbadge coverage -i coverage-cpp.xml -o docs/_site/badges/coverage.svg

    - name: Generate documentation
      run: doxygen docs/cpp/Doxyfile

    - name: Publish documentation to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        pacman -Sy --noconfirm openssh
        mkdir -p docs/_site
        cp -r docs/cpp/generated/html docs/_site/cpp
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/_site
        git commit -m "Auto-update documentation" || exit 0
        git subtree push --prefix docs/_site origin gh-pages

  sanitize-asan:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: build
    steps:
    - name: Setup Arch Linux
      run: pacman -Syu --noconfirm git

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: pacman -Sy --noconfirm clang cmake ninja

    - name: Build with ASan + UBSan + LSan
      run: |
        cmake -B cmake-build-asan -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined,leak" \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,leak" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined,leak"
        cmake --build cmake-build-asan

    - name: Run tests under ASan
      run: cd cmake-build-asan && ASAN_OPTIONS=detect_leaks=1 ctest --output-on-failure

  sanitize-msan:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: build
    steps:
    - name: Setup Arch Linux
      run: pacman -Syu --noconfirm git

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: pacman -Sy --noconfirm clang cmake ninja

    - name: Build with MSan
      run: |
        cmake -B cmake-build-msan -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="-fsanitize=memory -fno-omit-frame-pointer" \
          -DCMAKE_CXX_FLAGS="-fsanitize=memory -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory"
        cmake --build cmake-build-msan

    - name: Run tests under MSan
      run: cd cmake-build-msan && MSAN_OPTIONS=halt_on_error=1 ctest --output-on-failure

  sanitize-tsan:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: build
    steps:
    - name: Setup Arch Linux
      run: pacman -Syu --noconfirm git

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: pacman -Sy --noconfirm clang cmake ninja

    - name: Build with TSan
      run: |
        cmake -B cmake-build-tsan -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS="-fsanitize=thread" \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
        cmake --build cmake-build-tsan

    - name: Run tests under TSan
      run: cd cmake-build-tsan && TSAN_OPTIONS=halt_on_error=1 ctest --output-on-failure

  valgrind:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: build
    steps:
    - name: Setup Arch Linux
      run: pacman -Syu --noconfirm git

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: pacman -Sy --noconfirm clang cmake ninja valgrind

    - name: Build Debug
      run: cmake --preset linux-debug && cmake --build --preset linux-debug

    - name: Run tests under Valgrind memcheck
      run: cd cmake-build-linux-debug && ctest -T memcheck --output-on-failure

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy security scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'
        ignore-unfixed: true
