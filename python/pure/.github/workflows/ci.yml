name: CI Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm git

    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        pacman -Sy --noconfirm python python-pre-commit nodejs npm

    - name: Run pre-commit checks
      run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm git

    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        pacman -Sy --noconfirm python python-pip uv python-sphinx

    - name: Install Python dependencies
      run: uv sync

    - name: Run tests with coverage
      run: |
        if [ -d "test/python" ]; then
          python -m pytest test/python -v --cov --cov-report=xml --cov-report=term
        fi

    - name: Coverage summary
      if: always()
      run: |
        if [ -f coverage.xml ]; then
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          python -m pytest test/python --cov --cov-report=term-missing 2>/dev/null \
            | grep -E "^(TOTAL|src)" >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Python coverage report
      uses: actions/upload-artifact@v7
      with:
        name: python-coverage
        path: coverage.xml

    - name: PR coverage comment
      if: github.event_name == 'pull_request'
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-xml-coverage-path: coverage.xml

    - name: Generate coverage badge
      if: github.ref == 'refs/heads/main'
      run: |
        if [ -f coverage.xml ]; then
          mkdir -p docs/_site/badges
          genbadge coverage -i coverage.xml -o docs/_site/badges/coverage.svg
        fi

    - name: Generate documentation
      run: |
        cd docs/python
        sphinx-apidoc -o . ../../src --force
        make html

    - name: Publish documentation to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        pacman -Sy --noconfirm openssh
        mkdir -p docs/_site
        cp -r docs/python/_build/html docs/_site/python
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/_site
        git commit -m "Auto-update documentation" || exit 0
        git subtree push --prefix docs/_site origin gh-pages

  test-matrix:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: |
        if [ -d "test/python" ]; then
          python -m pytest test/python -v
        fi

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy security scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'
        ignore-unfixed: true
