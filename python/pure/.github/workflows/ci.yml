name: CI Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm
        pacman -Sy --noconfirm git

    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        pacman -Sy --noconfirm python python-pre-commit

    - name: Run pre-commit checks
      run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint
    steps:
    - name: Setup Arch Linux
      run: |
        pacman -Syu --noconfirm
        pacman -Sy --noconfirm git

    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        pacman -Sy --noconfirm python python-pip python-pytest python-sphinx

    - name: Install Python dependencies
      run: |
        pip install -e ".[dev]" --break-system-packages

    - name: Run tests with coverage
      run: |
        if [ -d "test/python" ]; then
          python -m pytest test/python -v --cov --cov-report=xml --cov-report=term
        fi

    - name: Upload Python coverage report
      uses: actions/upload-artifact@v4
      with:
        name: python-coverage
        path: coverage.xml

    - name: Generate documentation
      run: |
        cd docs/python
        sphinx-apidoc -o . ../../src --force
        make html

    - name: Publish documentation to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        pacman -Sy --noconfirm openssh
        mkdir -p docs/_site
        cp -r docs/python/_build/html docs/_site/python
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/_site
        git commit -m "Auto-update documentation" || exit 0
        git subtree push --prefix docs/_site origin gh-pages
